        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function cleanQuestionText(text) {
            return text.replace(/^\d+\.\s*/, '');
        }

        function cleanOptionText(text) {
            return text.replace(/^[A-E]\)\s*/, '');
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 50 * 60;
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    shfaqRezultatin();
                    alert("Koha mbaroi!");
                    return;
                }
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerDisplay.textContent = `Koha: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }, 1000);
        }

                    q.cleanOptions = q.options.map(opt => cleanOptionText(opt));

                });
                
                activeQuestions = temp;

                        q.cleanCorrectText = cleanOptionText(q.correctText);

                timerDisplay.textContent = "Koha: Rishikim";
            }

            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            container.innerHTML = '';
            if (activeQuestions.length === 0) return;

            const item = activeQuestions[currentIndex];
            const box = document.createElement('div');
            box.className = 'question-box active';

            if (item.image) {
                const imgDiv = document.createElement('div');
                imgDiv.className = 'question-image';
                const img = document.createElement('img');
                img.src = item.image || (item.id + '.png');
                img.alt = "Ilustrim për pyetjen";
                
                img.onclick = function() {
                    this.classList.toggle('zoomed');
                };

                imgDiv.appendChild(img);
                box.appendChild(imgDiv);
            }

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = cleanQuestionText(item.q);
            box.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            const letters = ['A', 'B', 'C', 'D', 'E'];

            item.cleanOptions.forEach((optText, index) => {
                const currentLetter = letters[index];
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'q_' + item.id;
                radio.value = optText;

                if (userAnswers[item.id] !== undefined) {
                    radio.disabled = true;
                    if (userAnswers[item.id] === optText) {
                        radio.checked = true;
                    }
                    if (optText === item.cleanCorrectText) {
                        label.classList.add('correct');
                    } else if (userAnswers[item.id] === optText && optText !== item.cleanCorrectText) {
                        label.classList.add('incorrect');
                    }
                }

                radio.onchange = function() {
                    userAnswers[item.id] = optText;
                    const allLabels = optionsDiv.querySelectorAll('label');
                    allLabels.forEach(l => l.querySelector('input').disabled = true);

                    if (optText === item.cleanCorrectText) {
                        label.classList.add('correct');
                    } else {
                        label.classList.add('incorrect');
                        allLabels.forEach(l => {
                            if (l.dataset.text === item.cleanCorrectText) {
                                l.classList.add('correct');
                            }
                        });
                    }
                };

                label.dataset.text = optText;
                label.appendChild(radio);
                label.appendChild(document.createTextNode(currentLetter + ') ' + optText));
                optionsDiv.appendChild(label);
            });

            box.appendChild(optionsDiv);
            container.appendChild(box);

            counterDisplay.textContent = `Pyetja: ${currentIndex + 1} / ${activeQuestions.length}`;
            prevBtn.style.display = currentIndex === 0 ? 'none' : 'inline-block';
            nextBtn.style.display = currentIndex === activeQuestions.length - 1 ? 'none' : 'inline-block';
        }

        function ndryshoPyetjen(drejtimi) {
            currentIndex += drejtimi;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= activeQuestions.length) currentIndex = activeQuestions.length - 1;
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let incorrectIdsGlobal = [];

        function shfaqRezultatin() {
            clearInterval(timerInterval);
            let teSakta = 0;
            incorrectIdsGlobal = [];

            activeQuestions.forEach(item => {
                const selectedAns = userAnswers[item.id];
                if (selectedAns && selectedAns === item.cleanCorrectText) {
                    teSakta++;
                } else {
                    incorrectIdsGlobal.push(item.id);
                }
            });

            const total = activeQuestions.length;
            const perqindja = (teSakta / total) * 100;
            const display = document.getElementById('result-display');

            if (perqindja >= 80) {
                display.className = "passed";
                display.textContent = `${teSakta}/${total} - Godkänt`;
            } else {
                display.className = "failed";
                display.textContent = `${teSakta}/${total} - Ej godkänt`;
            }

            submitBtn.style.display = 'none';
            if (incorrectIdsGlobal.length > 0) {
                reviewBtn.style.display = 'inline-block';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shkoTeGabimet() {
            krijoKuizin(true, incorrectIdsGlobal);
        }

        function provoPerseri() {
            krijoKuizin(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        krijoKuizin(false);
		        // ============================================
        // FUNKSIONI PËR MESAZHET E SIGURISË
        // ============================================
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: ${type === 'error' ? '#dc3545' : type === 'warning' ? '#e67e22' : '#003057'};
                color: white;
                padding: 14px 24px;
                border-radius: 10px;
                font-size: 14px;
                font-weight: 600;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 9999;
                font-family: Arial, sans-serif;
                max-width: 90%;
                animation: fadeIn 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Shto stilin për animacion
        const styleAnim = document.createElement('style');
        styleAnim.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleAnim);
    </script>
</body>
