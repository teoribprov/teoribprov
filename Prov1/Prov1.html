/* Dizajni i ri për Butonat me Grid */
/* Dizajn i pastër dhe modern për butonat */

#submit-btn { background-color: #27ae60; }
#review-btn { background-color: #8e44ad; }

    margin-top: 15px;

        .action-btn:hover { opacity: 0.9; }

        let questions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let timerInterval;
        let timeLeft = 50 * 60;

        const container = document.getElementById('quiz-container');

        // Funksioni për të përzier (shuffle) elementet e një array në mënyrë të rastësishme
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function inicializoTestin() {
            // 1. Përziejmë renditjen e pyetjeve, por secila pyetje mban foton e saj origjinale
            let tempQuestions = JSON.parse(JSON.stringify(originalQuestions));
            
            // Lidhim një ID origjinale që të dimë saktësisht se cila foto i takon secilës pyetje
            tempQuestions.forEach((item, originalIndex) => {
                // Nëse pyetja nuk ka foto të përcaktuar por ka numër (të gjitha i kanë te emri i skedarit ose mund t'i gjejmë nga pozita)
                // Për siguri absolute, ruajmë emrin e saktë të fotos bazuar te lista origjinale:
                if (!item.image) {
                    // Kontrollojmë nëse ka foto sipas indeksit origjinal + 1 (opsionale, por në kodin tuaj fotot janë 1.png, 2.png, etj.)
                }
            });

            // Përziejmë pyetjet
            shuffleArray(tempQuestions);

            // 2. Për secilën pyetje, përziejmë edhe opsionet duke ruajtur përgjigjen e saktë
            questions = tempQuestions.map(item => {
                let optionsWithIndex = item.options.map((opt, idx) => ({
                    text: opt,
                    isCorrect: idx === item.correct
                }));

                // Përziejmë opsionet
                shuffleArray(optionsWithIndex);

                // Gjejmë indeksin e ri të përgjigjes së saktë
                let newCorrectIndex = optionsWithIndex.findIndex(o => o.isCorrect);

                return {
                    q: item.q,
                    image: item.image, // Fotoja mbetet fiks e duhura për këtë pyetje!
                    options: optionsWithIndex.map(o => o.text),
                    correct: newCorrectIndex
                };
            });

            userAnswers = new Array(questions.length).fill(null);
            currentIndex = 0;
            timeLeft = 50 * 60;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    shfaqRezultatin();
                    alert("Koha mbaroi!");
                    return;
                }
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                document.getElementById('timer').textContent = `Koha: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }, 1000);
        }

        function krijoKuizin() {
            container.innerHTML = '';
            document.getElementById('review-container').innerHTML = '';
            document.getElementById('review-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';

            questions.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'question-box' + (index === 0 ? ' active' : '');
                box.id = 'question-' + index;

                if (item.image) {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'question-image';
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = "Ilustrim";
                    img.onclick = function() {
                        const modal = document.getElementById("imageModal");
                        const modalImg = document.getElementById("img01");
                        modal.style.display = "block";
                        modalImg.src = this.src;
                    };
                    imgDiv.appendChild(img);
                    box.appendChild(imgDiv);
                }

                const title = document.createElement('div');
                title.className = 'question-title';
                // Heqim numrin e vjetër nga teksti nëse ekziston që të mos duket i ngatërruar pas shuffle-it, ose e lëmë siç është. 
                // Këtu po shfaqim tekstin e pyetjes:
                title.textContent = `Pyetja ${index + 1}: ` + item.q.replace(/^\d+\.\s*/, '');
                box.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                item.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'q' + index;
                    radio.value = optIndex;

                    if (userAnswers[index] !== null) {
                        radio.disabled = true;
                        if (optIndex === userAnswers[index]) {
                            radio.checked = true;
                            if (optIndex === item.correct) label.classList.add('correct');
                            else label.classList.add('incorrect');
                        }
                        if (optIndex === item.correct && userAnswers[index] !== item.correct) {
                            label.classList.add('correct');
                        }
                    }

                    radio.onchange = function() {
                        userAnswers[index] = optIndex;
                        const allLabels = optionsDiv.querySelectorAll('label');
                        allLabels.forEach(l => l.querySelector('input').disabled = true);

                        if (optIndex === item.correct) {
                            label.classList.add('correct');
                        } else {
                            label.classList.add('incorrect');
                            allLabels[item.correct].classList.add('correct');
                        }
                    };

                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });

                box.appendChild(optionsDiv);
                container.appendChild(box);
            });

            updateProgress();
            startTimer();
        }

        function ndryshoPyetjen(direction) {
            document.getElementById('question-' + currentIndex).classList.remove('active');
            
            currentIndex += direction;
            
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= questions.length) currentIndex = questions.length - 1;

            document.getElementById('question-' + currentIndex).classList.add('active');
            updateProgress();
        }

        function updateProgress() {
            document.getElementById('progress-indicator').textContent = `Pyetja: ${currentIndex + 1} / ${questions.length}`;
            document.getElementById('prev-btn').style.display = currentIndex === 0 ? 'none' : 'inline-block';
            document.getElementById('next-btn').style.display = currentIndex === questions.length - 1 ? 'none' : 'inline-block';
        }

        function mbyllModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        function shfaqRezultatin() {
            clearInterval(timerInterval);
            let teSakta = 0;
            questions.forEach((item, index) => {
                if (userAnswers[index] === item.correct) {
                    teSakta++;
                }
            });

            const total = questions.length;
            const perqindja = (teSakta / total) * 100;
            const display = document.getElementById('result-display');

            if (perqindja >= 80) {
                display.className = "passed";
                display.textContent = `Rezultati: ${teSakta}/${total} - Godkänt (Kaluat)`;
            } else {
                display.className = "failed";
                display.textContent = `Rezultati: ${teSakta}/${total} - Ej godkänt (Nuk kaluat)`;
            }

            document.getElementById('review-btn').style.display = 'inline-block';
        }

        function shikoGabimet() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('main-nav-buttons').style.display = 'none';
            
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '<h2 style="color: #c0392b; text-align: center;">Pyetjet që keni gabuar:</h2>';
            
            let kaGabime = false;

            questions.forEach((item, index) => {
                if (userAnswers[index] !== item.correct) {
                    kaGabime = true;
                    const box = document.createElement('div');
                    box.className = 'question-box active';
                    box.style.marginBottom = '20px';

                    if (item.image) {
                        const imgDiv = document.createElement('div');
                        imgDiv.className = 'question-image';
                        const img = document.createElement('img');
                        img.src = item.image;
                        img.alt = "Ilustrim";
                        img.onclick = function() {
                            const modal = document.getElementById("imageModal");
                            const modalImg = document.getElementById("img01");
                            modal.style.display = "block";
                            modalImg.src = this.src;
                        };
                        imgDiv.appendChild(img);
                        box.appendChild(imgDiv);
                    }

                    const title = document.createElement('div');
                    title.className = 'question-title';
                    title.textContent = `Pyetja ${index + 1}: ` + item.q.replace(/^\d+\.\s*/, '');
                    box.appendChild(title);

                    const optionsDiv = document.createElement('div');
                    optionsDiv.className  = 'options';

                    item.options.forEach((opt, optIndex) => {
                        const label = document.createElement('label');
                        
                        if (optIndex === item.correct) {
                            label.classList.add('correct');
                        } else if (optIndex === userAnswers[index]) {
                            label.classList.add('incorrect');
                        }

                        label.appendChild(document.createTextNode(opt));
                        optionsDiv.appendChild(label);
                    });

                    box.appendChild(optionsDiv);
                    reviewContainer.appendChild(box);
                }
            });

            if (!kaGabime) {
                reviewContainer.innerHTML += '<p style="text-align: center; font-size: 18px; color: #27ae60; font-weight: bold;">Urime! Nuk keni asnjë gabim në këtë test!</p>';
            }

            const kthimiBtn = document.createElement('div');
            kthimiBtn.style.textAlign = 'center';
            kthimiBtn.innerHTML = `<button class="action-btn" style="background-color: #2980b9; margin-bottom: 30px;" onclick="kthehuTeRezultati()">Kthehu tek Rezultati</button>`;
            reviewContainer.appendChild(kthimiBtn);

            reviewContainer.style.display = 'block';
        }

        function kthehuTeRezultati() {
            document.getElementById('review-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('main-nav-buttons').style.display = 'block';
            
            document.querySelectorAll('.question-box').forEach(b => b.classList.remove('active'));
            document.getElementById('question-0').classList.add('active');
            currentIndex = 0;
            updateProgress();
        }

        function provoPerseri() {
            document.getElementById('result-display').textContent = '';
            document.getElementById('result-display').className = '';
            document.getElementById('review-btn').style.display = 'none';
            document.getElementById('main-nav-buttons').style.display = 'block';
            
            // Krijon një renditje krejtësisht të re (shuffle) për pyetjet dhe opsionet
            inicializoTestin();
            krijoKuizin();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Nisja e parë e testit
        inicializoTestin();
        krijoKuizin();
		        // ============================================
        // FUNKSIONI PËR MESAZHET E SIGURISË
        // ============================================
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: ${type === 'error' ? '#dc3545' : type === 'warning' ? '#e67e22' : '#003057'};
                color: white;
                padding: 14px 24px;
                border-radius: 10px;
                font-size: 14px;
                font-weight: 600;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 9999;
                font-family: Arial, sans-serif;
                max-width: 90%;
                animation: fadeIn 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Shto stilin për animacion
        const styleAnim = document.createElement('style');
        styleAnim.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleAnim);
    </script>
</body>
