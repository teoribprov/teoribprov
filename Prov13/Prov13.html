            "A: Nuk duhet të bëj asgjë se nuk shihet që ka fëmijë në rrugë",
            "B: Duhet të jem gati për të frenuar sepse ka mundësi që fëmijët befas të ma presin rrugën",
            "C: Mbasi ta kaloj shenjën, shpejtësia maksimale është 30 km në orë",
            "D: Po afrohem te një vendkalim të pambikëqyrur afër një kopshti me lodra fëmijësh"
        ],
        correctText: "B: Duhet të jem gati për të frenuar sepse ka mundësi që fëmijët befas të ma presin rrugën"
    }
];

        // ============================================
        // LOGJIKA E TESTIT (E PËRDITËSUAR)
        // ============================================

        let activeQuestions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let timerInterval = null;
        let timeLeft = 50 * 60;
        let isReviewMode = false;

        const container = document.getElementById('quiz-container');
        const counterDisplay = document.getElementById('question-counter');
        const timerDisplay = document.getElementById('timer');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const reviewBtn = document.getElementById('review-btn');

        // [FUNKSIONI I RI] Përzien pyetjet, duke i mbajtur fotot të lidhura me pyetjet
        function përziejPyetjet(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 50 * 60;
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    shfaqRezultatin();
                    alert("Koha mbaroi!");
                    return;
                }
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerDisplay.textContent = `Koha: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }, 1000);
        }

        function krijoKuizin(isReview = false, incorrectIds = []) {
            container.innerHTML = '';
            isReviewMode = isReview;
            
            if (!isReview) {
                // Krijon kopje të thellë të pyetjeve origjinale
                activeQuestions = JSON.parse(JSON.stringify(originalQuestions));
                
                // [NDRYSHIMI I RI] Aktivizon përzierjen për çdo provë të re
                activeQuestions = përziejPyetjet(activeQuestions);

                userAnswers = {};
                currentIndex = 0;
                startTimer();
                submitBtn.style.display = 'inline-block';
                reviewBtn.style.display = 'none';
                document.getElementById('result-display').textContent = '';
                document.getElementById('result-display').className = '';
            } else {
                activeQuestions = originalQuestions.filter(q => incorrectIds.includes(q.id));
                currentIndex = 0;
                submitBtn.style.display = 'none';
                reviewBtn.style.display = 'none';
                clearInterval(timerInterval);
                timerDisplay.textContent = "Koha: Rishikim";
            }

            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            container.innerHTML = '';
            if (activeQuestions.length === 0) {
                const box = document.createElement('div');
                box.className = 'question-box active';
                box.innerHTML = '<p style="text-align:center; padding:40px; font-size:18px; color:#7f8c8d;">⚠️ Nuk ka pyetje për këtë prov.</p>';
                container.appendChild(box);
                counterDisplay.textContent = `Pyetja: 0 / 0`;
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                return;
            }

            const item = activeQuestions[currentIndex];
            const box = document.createElement('div');
            box.className = 'question-box active';

            // Fotot mbeten të lidhura sepse janë pjesë e objektit të pyetjes (item.image)
            if (item.image) {
                const imgDiv = document.createElement('div');
                imgDiv.className = 'question-image';
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = "Ilustrim për pyetjen " + item.id;
                
                img.onclick = function() {
                    this.classList.toggle('zoomed');
                };

                imgDiv.appendChild(img);
                box.appendChild(imgDiv);
            }

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `${currentIndex + 1}/${activeQuestions.length} - ${item.q}`;
            box.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            item.options.forEach((optText) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'q_' + item.id;
                radio.value = optText;

                if (userAnswers[item.id] !== undefined) {
                    radio.disabled = true;
                    if (userAnswers[item.id] === optText) {
                        radio.checked = true;
                    }
                    if (optText === item.correctText) {
                        label.classList.add('correct');
                    } else if (userAnswers[item.id] === optText && optText !== item.correctText) {
                        label.classList.add('incorrect');
                    }
                }

                radio.onchange = function() {
                    userAnswers[item.id] = optText;
                    const allLabels = optionsDiv.querySelectorAll('label');
                    allLabels.forEach(l => l.querySelector('input').disabled = true);

                    if (optText === item.correctText) {
                        label.classList.add('correct');
                    } else {
                        label.classList.add('incorrect');
                        allLabels.forEach(l => {
                            if (l.dataset.text === item.correctText) {
                                l.classList.add('correct');
                            }
                        });
                    }
                };

                label.dataset.text = optText;
                label.appendChild(radio);
                label.appendChild(document.createTextNode(optText));
                optionsDiv.appendChild(label);
            });

            box.appendChild(optionsDiv);
            container.appendChild(box);

            counterDisplay.textContent = `Pyetja: ${currentIndex + 1} / ${activeQuestions.length}`;
            prevBtn.style.display = currentIndex === 0 ? 'none' : 'inline-block';
            nextBtn.style.display = currentIndex === activeQuestions.length - 1 ? 'none' : 'inline-block';
        }

        function ndryshoPyetjen(drejtimi) {
            if (activeQuestions.length === 0) return;
            currentIndex += drejtimi;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= activeQuestions.length) currentIndex = activeQuestions.length - 1;
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let incorrectIdsGlobal = [];

        function shfaqRezultatin() {
            if (activeQuestions.length === 0) {
                alert("Nuk ka pyetje për të vlerësuar!");
                return;
            }
            
            clearInterval(timerInterval);
            let teSakta = 0;
            incorrectIdsGlobal = [];

            activeQuestions.forEach(item => {
                const selectedAns = userAnswers[item.id];
                if (selectedAns && selectedAns === item.correctText) {
                    teSakta++;
                } else {
                    incorrectIdsGlobal.push(item.id);
                }
            });

            const total = activeQuestions.length;
            const perqindja = (teSakta / total) * 100;
            const display = document.getElementById('result-display');

            if (perqindja >= 80) {
                display.className = "passed";
                display.textContent = `${teSakta}/${total} - Godkänt`;
            } else {
                display.className = "failed";
                display.textContent = `${teSakta}/${total} - Ej godkänt`;
            }

            submitBtn.style.display = 'none';
            if (incorrectIdsGlobal.length > 0) {
                reviewBtn.style.display = 'inline-block';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shkoTeGabimet() {
    shfaqListenGabimeve();
}

function shfaqListenGabimeve() {
    container.innerHTML = '';
    const gabuara = activeQuestions.filter(q => incorrectIdsGlobal.includes(q.id));
    const teSaktat = activeQuestions.filter(q => !incorrectIdsGlobal.includes(q.id));
    function renderNjeRresht(item, index, totali) {
        const box = document.createElement('div');
        box.className = 'question-box active';
        box.style.marginBottom = '15px';
        if (item.image) {
            const imgDiv = document.createElement('div');
            imgDiv.className = 'question-image';
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = "Ilustrim për pyetjen " + item.id;
            img.onclick = function() { this.classList.toggle('zoomed'); };
            imgDiv.appendChild(img);
            box.appendChild(imgDiv);
        }
        const title = document.createElement('div');
        title.className = 'question-title';
        title.textContent = `${index + 1}/${totali} - ${item.q}`;
        box.appendChild(title);
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        const perdoruesiZgjodhi = userAnswers[item.id];
        item.options.forEach((optText) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.disabled = true;
            if (perdoruesiZgjodhi === optText) radio.checked = true;
            if (optText === item.correctText) {
                label.classList.add('correct');
            } else if (perdoruesiZgjodhi === optText) {
                label.classList.add('incorrect');
            }
            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            optionsDiv.appendChild(label);
        });
        box.appendChild(optionsDiv);
        container.appendChild(box);
    }
    const titulliGabimeve = document.createElement('div');
    titulliGabimeve.className = 'question-title';
    titulliGabimeve.style.color = '#c0392b';
    titulliGabimeve.textContent = `❌ Pyetjet e gabuara (${gabuara.length})`;
    container.appendChild(titulliGabimeve);
    gabuara.forEach((item, index) => renderNjeRresht(item, index, gabuara.length));
    const titulliSakta = document.createElement('div');
    titulliSakta.className = 'question-title';
    titulliSakta.style.color = '#27ae60';
    titulliSakta.style.marginTop = '25px';
    titulliSakta.textContent = `✅ Pyetjet e sakta (${teSaktat.length})`;
    container.appendChild(titulliSakta);
    teSaktat.forEach((item, index) => renderNjeRresht(item, index, teSaktat.length));
    counterDisplay.textContent = `Gabimet: ${gabuara.length} / Sakta: ${teSaktat.length}`;
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    submitBtn.style.display = 'none';
    reviewBtn.style.display = 'none';
}

        function provoPerseri() {
            // [NDRYSHIMI I RI] Kjo rifillon testin dhe e përzien sërish listën e pyetjeve
            krijoKuizin(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fillimi i testit
        krijoKuizin(false);
		        // ============================================
        // FUNKSIONI PËR MESAZHET E SIGURISË
        // ============================================
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: ${type === 'error' ? '#dc3545' : type === 'warning' ? '#e67e22' : '#003057'};
                color: white;
                padding: 14px 24px;
                border-radius: 10px;
                font-size: 14px;
                font-weight: 600;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 9999;
                font-family: Arial, sans-serif;
                max-width: 90%;
                animation: fadeIn 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Shto stilin për animacion
        const styleAnim = document.createElement('style');
        styleAnim.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleAnim);
    </script>
</body>
