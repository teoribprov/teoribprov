<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testet e Patentë Shoferit</title>
    
    <!-- Skedarët Kryesorë të Sigurisë dhe Firebase me Shteg Absolut (/) -->
    <script src="/security.js" defer></script>
    <script src="/firebase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #003057;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, background-color 0.2s;
            display: block;
        }
        .card:hover {
            transform: translateY(-3px);
            background-color: #003057;
            color: white;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>🔒 Testet e Patentë Shoferit</h1>
    <p class="status" id="db-status">⚡ Po kontrollohet lidhja me Firebase...</p>
    <br>

    <div class="grid-container">
        <a href="/Prov1/Prov1.html" class="card" onclick="ruajKlikimin('Prov1')">📝 Prova 1</a>
        <a href="/Prov2/Prov2.html" class="card" onclick="ruajKlikimin('Prov2')">📝 Prova 2</a>
        <a href="/Prov3/Prov3.html" class="card" onclick="ruajKlikimin('Prov3')">📝 Prova 3</a>
        <a href="/Prov4/Prov4.html" class="card" onclick="ruajKlikimin('Prov4')">📝 Prova 4</a>
        <a href="/Prov5/Prov5.html" class="card" onclick="ruajKlikimin('Prov5')">📝 Prova 5</a>
        <a href="/Prov6/Prov6.html" class="card" onclick="ruajKlikimin('Prov6')">📝 Prova 6</a>
        <a href="/Prov7/Prov7.html" class="card" onclick="ruajKlikimin('Prov7')">📝 Prova 7</a>
        <a href="/Prov8/Prov8.html" class="card" onclick="ruajKlikimin('Prov8')">📝 Prova 8</a>
        <a href="/Prov9/Prov9.html" class="card" onclick="ruajKlikimin('Prov9')">📝 Prova 9</a>
        <a href="/Prov10/Prov10.html" class="card" onclick="ruajKlikimin('Prov10')">📝 Prova 10</a>
        <a href="/Prov11/Prov11.html" class="card" onclick="ruajKlikimin('Prov11')">📝 Prova 11</a>
        <a href="/Prov12/Prov12.html" class="card" onclick="ruajKlikimin('Prov12')">📝 Prova 12</a>
        <a href="/Prov13/Prov13.html" class="card" onclick="ruajKlikimin('Prov13')">📝 Prova 13</a>
    </div>

    <script>
        // Verifikimi i Lidhjes me Firebase
        window.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('db-status');
            if (typeof database !== 'undefined') {
                statusEl.innerHTML = "🟢 U lidh me Firebase! Të dhënat ruhen online.";
                statusEl.style.color = "green";
            } else {
                statusEl.innerHTML = "🔴 Gabim: firebase-config.js nuk u ngarkua saktë!";
                statusEl.style.color = "red";
            }
        });

        // Ruajtja e klikimeve direct në Firebase (jo në localStorage)
        function ruajKlikimin(emriProves) {
            if (typeof database !== 'undefined') {
                const ref = database.ref('statistikat/klikimet/' + emriProves);
                ref.transaction((currentValue) => {
                    return (currentValue || 0) + 1;
                });
            }
        }
    </script>
</body>
</html>
